<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editorial Grid Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, minmax(250px, 1fr));
      grid-auto-rows: 280px;
      gap: 15px;
      width: 100%;
      max-width: 1200px;
    }

    .grid-item {
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      padding: 24px;
    }

    .grid-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.15);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .content h2 {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      max-width: 85%;
    }

    .read-btn {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      align-self: flex-end;
      transition: color 0.2s ease;
    }

    .read-btn:hover {
      color: #ffffff;
    }

    .instagram-toxic {
      grid-column: span 2;
    }

    .ocean {
      grid-column: span 2;
      grid-row: span 1;
    }

    .room {
      grid-column: span 1;
      grid-row: span 1;
    }

    .winter {
      background-image: url('https://unsplash.com');
      background-color: #030e20;
    }

    .instagram-toxic {
      background-image: url('https://unsplash.com');
      background-color: #d16a5a;
    }

    .ocean {
      background-image: url('https://unsplash.com');
      background-color: #2b77a7;
    }

    .room {
      background-image: url('https://unsplash.com');
      background-color: #e58d80;
    }

    .horizon {
      background-image: url('https://unsplash.com');
      background-color: #723438;
    }

    .water {
      background-image: url('https://unsplash.com');
      background-color: #0b1d33;
    }

    .table-one {
      background-image: url('https://unsplash.com');
      background-color: #cd6254;
    }

    @media (max-width: 900px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .instagram-toxic, .ocean {
        grid-column: span 2;
      }
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: 1fr;
        grid-auto-rows: auto;
      }
      .grid-item {
        height: 250px;
      }
      .instagram-toxic, .ocean {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="grid-container">
    
    <div class="grid-item winter">
      <div class="content">
        <h2>The winter of my discontent</h2>
        <a href="#" class="read-btn">READ POST</a>
      </div>
    </div>

    <div class="grid-item instagram-toxic">
      <div class="content">
        <h2>Instagram is toxic but I keep posting</h2>
        <a href="#" class="read-btn">READ POST</a>
      </div>
    </div>

    <div class="grid-item ocean">
      <div class="content">
        <h2>Throwing my phone into the ocean</h2>
        <a href="#" class="read-btn">READ POST</a>
      </div>
    </div>

    <div class="grid-item room">
      <div class="content">
        <h2>I'm never leaving my room</h2>
        <a href="#" class="read-btn">READ POST</a>
      </div>
    </div>

    <div class="grid-item horizon">
      <div class="content">
        <h2>Staring at the horizon thinking</h2>
        <a href="#" class="read-btn">READ POST</a>
      </div>
    </div>

    <div class="grid-item water">
      <div class="content">
        <h2>This is water</h2>
        <a href="#" class="read-btn">READ POST</a>
      </div>
    </div>

    <div class="grid-item table-one">
      <div class="content">
        <h2>Table for one please</h2>
        <a href="#" class="read-btn">READ POST</a>
      </div>
    </div>

  </div>

</body>
</html>
