<!DOCTYPE html>
<html>
<head>
    <title>Assignment 11</title>
</head>

<body>
    <style>
        body {
    margin: 0;
    padding: 50px;
    font-family: Arial, sans-serif;
}

h1 {
    margin-bottom: 50px;
}

.gallery {
    display: grid;
    grid-template-columns: 1fr 1fr 1.7fr;
    grid-template-rows: 115px 220px 190px;
    gap: 14px;
    max-width: 650px;
}

.item {
    overflow: hidden;
}

.item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.item1 {
    grid-column: 1;
    grid-row: 1;
}

.item2 {
    grid-column: 2;
    grid-row: 1;
}

.item3 {
    grid-column: 3;
    grid-row: 1 / 3;
}

.item4 {
    grid-column: 1 / 3;
    grid-row: 2;
}

.item5 {
    grid-column: 1 / 3;
    grid-row: 3;
}

.item6 {
    grid-column: 3;
    grid-row: 3;
}
    </style>
    <div class="gallery">

        <div class="item item1">
            <img src="https://images.unsplash.com/photo-1498557850523-fd3d118b962e" alt="Blueberries">
        </div>

        <div class="item item2">
            <img src="https://images.unsplash.com/photo-1464965911861-746a04b4bca6" alt="Strawberries">
        </div>

        <div class="item item3">
            <img src="https://images.unsplash.com/photo-1582281298055-e25b84a30b0b" alt="Watermelon">
        </div>

        <div class="item item4">
            <img src="https://images.unsplash.com/photo-1582979512210-99b6a53386f9" alt="Orange">
        </div>

        <div class="item item5">
            <img src="https://images.unsplash.com/photo-1528825871115-3581a5387919" alt="Papaya">
        </div>

        <div class="item item6">
            <img src="https://images.unsplash.com/photo-1550258987-190a2d41a8ba" alt="Pineapple">
        </div>

    </div>

</body>
</html>
