<!DOCTYPE html>
<html>

    <title>Assignment 1</title>
</head>
<body>
    <style>
        .grid {
    display: grid;
    grid-template-columns: 100px 100px 100px;
    grid-template-rows: 100px 100px 100px;
    gap: 10px;
}

.box {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: rgb(243, 43, 183);
    font-size: 25px;
}
        </style>

    <div class="grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
    </div>

</body>
</html>
