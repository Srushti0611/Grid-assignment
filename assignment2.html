<!DOCTYPE html>
<html>
<head>
    <title>Blog Page</title>
</head>
<body>
    <style>

.blog {
    display: grid;
    grid-template-columns: 1fr 3fr;
    grid-template-rows: 100px 300px 80px;

    grid-template-areas:
        "header header"
        "sidebar main"
        "footer footer";
}

header {
    grid-area: header;
    background-color: rgb(4, 101, 133);
    padding: 20px;
}

aside {
    grid-area: sidebar;
    background-color: rgb(165, 190, 231);
    padding: 20px;
}

main {
    grid-area: main;
    background-color: rgb(169, 213, 231);
    padding: 20px;
}

footer {
    grid-area: footer;
    background-color: rgb(237, 243, 243);
    padding: 20px;
}
    </style>

    <div class="blog">

        <header>
            <h1>My Blog</h1>
        </header>

        <aside>
            <h2>Sidebar</h2>
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </aside>

        <main>
            <h2>Welcome to My Blog</h2>
            <p>
                This is the main content of my blog page.
            </p>
        </main>

        <footer>
            <p>© 2026 My Blog</p>
        </footer>

    </div>

</body>
</html>
